services:
  smartfinance-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5150:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Data Source=/data/app.db"
    volumes:
      - smartfinance-data:/data

volumes:
  smartfinance-data: