name: SmartFinance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartFinance.sln

      - name: Build
        run: dotnet build SmartFinance.sln --no-restore
        
      - name: Test
        run: dotnet test SmartFinance.sln --no-build --no-restore