name: SmartFinance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartFinance.sln

      - name: Build
        run: dotnet build SmartFinance.sln --no-restore
        
      - name: Test
        run: dotnet test SmartFinance.sln --no-build --no-restore

      - name: Start application with Docker Compose
        id: start_api
        run: docker compose up --build -d

      - name: Wait for API
        id: wait_for_api
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5150/swagger/v1/swagger.json > /dev/null; then
              echo "API is up and running."
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time."
          exit 1

      - name: Show container logs on failure
        if: failure() && (steps.start_api.outcome == 'failure' || steps.wait_for_api.outcome == 'failure')
        run: docker compose logs --no-color || true

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down -v --remove-orphans
